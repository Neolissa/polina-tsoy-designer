<div class="tvip-app" data-tvip-app role="application" aria-label="TVIP demo">
  <div class="tvip-screen is-active" data-tvip-screen="catalog" data-tvip-devices="desktop,tablet,mobile">
    <div class="tvip-home">
      <header class="tvip-home-header">
        <div class="tvip-home-brand" aria-hidden="true">
          <img class="tvip-home-logo" alt="TVIP" data-tvip-src="logo/tvip-logo.webp" />
        </div>
        <div class="tvip-content-tabs" role="tablist" aria-label="Категория контента">
          <button type="button" class="tvip-content-tab active" data-tvip-content="movie" role="tab">Фильм</button>
          <button type="button" class="tvip-content-tab" data-tvip-content="channel" role="tab">Канал</button>
        </div>
      </header>
      <div class="tvip-home-main">
        <div class="tvip-home-panel is-active" data-tvip-home-panel="movie">
          <h3 class="tvip-row-title">Популярные фильмы</h3>
          <div class="tvip-poster-row tvip-poster-row--scroll" tabindex="0" aria-label="Фильмы">
            <button type="button" class="tvip-land-card" aria-label="Сигнал">
              <img class="tvip-land-card__img" alt="Сигнал" data-tvip-src="posters/bloodshot.webp" />
              <span class="tvip-land-card__label">Сигнал</span>
            </button>
            <button type="button" class="tvip-land-card" aria-label="Право голоса">
              <img class="tvip-land-card__img" alt="Право голоса" data-tvip-src="posters/marathon.webp" />
              <span class="tvip-land-card__label">Право голоса</span>
            </button>
            <button type="button" class="tvip-land-card" aria-label="Место встречи">
              <img class="tvip-land-card__img" alt="Место встречи" data-tvip-src="posters/odin-vdoh.webp" />
              <span class="tvip-land-card__label">Место встречи</span>
            </button>
          </div>
        </div>
        <div class="tvip-home-panel" data-tvip-home-panel="channel" hidden>
          <h3 class="tvip-row-title">Телеканалы</h3>
          <div class="tvip-channel-list">
            <article class="tvip-channel-card" aria-label="Первый канал">
              <img class="tvip-channel-card__thumb" alt="" data-tvip-src="channels/ch-1.webp" />
              <div class="tvip-channel-card__info">
                <h3 class="tvip-channel-card__name">Первый канал</h3>
                <p class="tvip-channel-card__now">Новости</p>
              </div>
            </article>
            <article class="tvip-channel-card" aria-label="Россия 1">
              <img class="tvip-channel-card__thumb" alt="" data-tvip-src="channels/ch-2.webp" />
              <div class="tvip-channel-card__info">
                <h3 class="tvip-channel-card__name">Россия 1</h3>
                <p class="tvip-channel-card__now">Кто против?</p>
              </div>
            </article>
            <article class="tvip-channel-card" aria-label="Матч ТВ">
              <img class="tvip-channel-card__thumb" alt="" data-tvip-src="channels/ch-3.webp" />
              <div class="tvip-channel-card__info">
                <h3 class="tvip-channel-card__name">Матч ТВ</h3>
                <p class="tvip-channel-card__now">Хоккей</p>
              </div>
            </article>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
