<div class="docsbird-flow" data-docsbird-flow role="application" aria-label="DocsBird single-screen demo">
  <div class="docsbird-flow__stage">
    <section class="docsbird-flow__screen is-active" data-docsbird-screen="agreements">
      <div class="docsbird-flow__layout">
        <aside class="docsbird-flow__sidebar" aria-label="Main navigation">
          <div class="docsbird-flow__brand">DocsBird</div>
          <button type="button" class="docsbird-flow__nav is-active">Agreements</button>
          <button type="button" class="docsbird-flow__nav">Dashboard</button>
          <button type="button" class="docsbird-flow__nav">Invoices</button>
        </aside>
        <main class="docsbird-flow__main">
          <header class="docsbird-flow__page-head">
            <div class="docsbird-flow__page-head-copy">
              <h2 class="docsbird-flow__title">Agreements</h2>
              <p class="docsbird-flow__subtitle">Framework contracts for Baltic and EU clients</p>
            </div>
            <button type="button" class="mock-btn-primary docsbird-flow__btn">+ New agreement</button>
          </header>
          <div class="docsbird-flow__main-body">
            <div class="docsbird-flow__kpis">
              <div class="docsbird-flow__kpi"><span>Active</span><strong>26</strong></div>
              <div class="docsbird-flow__kpi"><span>In review</span><strong>4</strong></div>
              <div class="docsbird-flow__kpi"><span>Expiring</span><strong>2</strong></div>
            </div>
            <div class="docsbird-flow__cards">
              <div class="docsbird-flow__card is-selected">
                <span class="docsbird-flow__card-status docsbird-flow__card-status--ok">Active</span>
                <strong>Baltic Trade Ltd</strong>
                <span>Framework · LV · until 2027</span>
              </div>
              <div class="docsbird-flow__card">
                <span class="docsbird-flow__card-status">Draft</span>
                <strong>Nord Logistics</strong>
                <span>NDA · in review</span>
              </div>
              <div class="docsbird-flow__card">
                <span class="docsbird-flow__card-status docsbird-flow__card-status--warn">Expiring</span>
                <strong>Eesti Solutions</strong>
                <span>Service · 14 days left</span>
              </div>
            </div>
          </div>
        </main>
      </div>
    </section>
  </div>
</div>
