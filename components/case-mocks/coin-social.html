<div class="coin-mock mock-app" data-theme="coin" role="region" aria-label="Coin single-screen demo">
  <div class="coin-coin-rain" data-coin-rain aria-hidden="true"></div>
  <div class="coin-mock__shell">
    <aside class="coin-mock__sidebar mock-sidebar" aria-label="Main menu">
      <div class="coin-mock__brand-lockup">
        <span class="coin-mock__brand-mark">coin</span>
        <span class="coin-mock__brand-sub">Corporate</span>
      </div>
      <nav class="coin-mock__nav">
        <button type="button" class="mock-nav-item active" data-coin-nav="feed">Feed</button>
      </nav>
    </aside>
    <main class="coin-mock__main">
      <header class="coin-mock__page-head">
        <div class="coin-mock__page-head-text">
          <h1 class="coin-mock__page-title" data-coin-page-title>Corporate feed</h1>
          <p class="coin-mock__page-sub" data-coin-page-sub>Single-screen demo · engagement focus</p>
        </div>
      </header>

      <div data-coin-panel="feed">
        <div class="coin-mock__tabs" role="tablist" aria-label="Feed filters">
          <button type="button" class="coin-mock__tab active" data-coin-filter="all">All</button>
          <button type="button" class="coin-mock__tab" data-coin-filter="thanks">Thanks</button>
        </div>

        <article class="coin-feed-card" data-coin-post="1">
          <div class="coin-mock__post-head">
            <span class="coin-mock__avatar coin-mock__avatar--blue">AK</span>
            <div class="coin-mock__post-body">
              <div class="coin-mock__author">Anna Kozlova · Product</div>
              <p class="coin-mock__post-text">Weekly UX digest and onboarding tips for all teams.</p>
              <div class="coin-feed-actions">
                <button type="button" class="mock-btn-secondary coin-mock__btn-xs" data-coin-like>👍 12</button>
                <button type="button" class="mock-btn-primary coin-mock__btn-xs coin-mock__btn-thanks" data-coin-thanks>
                  <span data-coin-thanks-label>🪙 Thank</span>
                </button>
              </div>
            </div>
          </div>
        </article>

        <article class="coin-feed-card hidden" data-coin-post-filter="thanks">
          <div class="coin-mock__post-head">
            <span class="coin-mock__avatar coin-mock__avatar--gold">MS</span>
            <div class="coin-mock__post-body">
              <div class="coin-mock__author">Mikhail Sokolov · Engineering</div>
              <p class="coin-mock__post-text">Thanks sent to QA squad for release support.</p>
              <div class="coin-mock__meta">24 coins sent today</div>
            </div>
          </div>
        </article>
      </div>
    </main>
  </div>
</div>
